# Cramly - Render blueprint.
# Native Python deployment for the current Sprint 4 backend:
# - `cramly-api` serves FastAPI
# - `cramly-worker` processes async jobs
# Known limitation: image OCR is not production-ready on native Render because
# the repo's Tesseract-based extractor expects a host binary. See
# docs/RENDER-DEPLOY.md for the full setup guide and caveats.

services:
  - type: web
    name: cramly-api
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SERVICE_NAME
        value: cramly-api
      - key: FIREBASE_PROJECT_ID
        value: cramly-cd9b5
      - key: FIREBASE_STORAGE_BUCKET
        value: cramly-cd9b5.firebasestorage.app
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GROQ_API_KEY
        sync: false

  - type: worker
    name: cramly-worker
    runtime: python
    region: singapore
    plan: starter
    rootDir: backend
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m worker.worker
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: commit
    envVars:
      - key: ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: SERVICE_NAME
        value: cramly-worker
      - key: FIREBASE_PROJECT_ID
        value: cramly-cd9b5
      - key: FIREBASE_STORAGE_BUCKET
        value: cramly-cd9b5.firebasestorage.app
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: WORKER_POLL_INTERVAL_SECONDS
        value: "2"
      - key: WORKER_HEARTBEAT_INTERVAL_SECONDS
        value: "30"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GROQ_API_KEY
        sync: false
